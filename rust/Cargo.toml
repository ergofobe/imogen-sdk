[package]
name = "imogen-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for the imogen photo library API"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ergofobe/imogen-sdk"
keywords = ["imogen", "photos", "self-hosted", "api-client"]
categories = ["api-bindings"]
readme = "README.md"

[dependencies]
base64 = "0.22"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "stream",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
