name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a maintainer can re-run the suite without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each port is checked on its own, because each can break on its own. They share only
# conformance/, and a change there is meant to fail in whichever language disagrees with
# it rather than in all five at once.

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # npm, not as a package manager: the packaging test asks `npm pack` what the tarball
      # would contain, because npm is what will build it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # The published packages are the compiled output, so a build that no longer emits is
      # a release-blocking break even when the suite is green.
      - name: Build
        run: bun run build
      # `bun run test`, not `bun test`: the script scopes the run to packages/, and the bare
      # command would scan live/ too — which throws without a server on the other end.
      - name: Test
        run: bun run test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  swift:
    # macOS, because that is where the client is actually deployed. The suite is an
    # executable rather than an XCTest bundle, so it runs anywhere a toolchain does.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Conformance
        run: swift run ImogenSDKConformance

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew build --no-daemon

  # The five jobs above check this repository against itself. This one checks it against
  # the world it has to keep working in: the client on this branch, over real HTTP, against
  # the server image of the last release. See CONTRIBUTING.md for what a red run means.
  forward-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector, not stock postgres: the server's own migrations reach for the extension
        # on the way up, and fail the container before it ever serves a request.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: imogen
          POSTGRES_PASSWORD: imogen
          POSTGRES_DB: imogen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imogen -d imogen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Resolved at run time rather than pinned here, so this tracks server releases
      # without a pointer anyone has to remember to bump.
      - name: Resolve the last released server
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo ergofobe/imogen-server --json tagName -q '.tagName')
          # Releases are tagged `v0.3.0`; ghcr publishes `0.3.0`. The two namespaces
          # disagree by exactly one character, and `v0.3.0` is `manifest unknown`.
          echo "image=ghcr.io/ergofobe/imogen-server:${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Resolving at run time means the run is the only record of what it tested.
          echo "Checked against imogen-server $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Start ${{ steps.server.outputs.tag }}
        # Through the environment rather than interpolated into the script: the value comes
        # back from an API call, and `run:` splices before the shell ever sees a quote.
        env:
          IMAGE: ${{ steps.server.outputs.image }}
        run: |
          set -euo pipefail
          # Deliberately not :latest — that tracks main, which is the wrong side of the
          # question. A missing image fails the job here rather than falling through to
          # something else and reporting a compatibility that was never tested.
          docker pull "$IMAGE"
          # --network host so the container reaches the postgres service on the runner's
          # own localhost, and the runner reaches the server the same way.
          docker run -d --name imogen-server --network host \
            -e DATABASE_URL=postgres://imogen:imogen@localhost:5432/imogen \
            -e IMOGEN_PUBLIC_URL=http://localhost:3000 \
            -e IMOGEN_ALLOW_SIGNUP=true \
            "$IMAGE"
          # The image runs its own migrations before it serves, so there are none to run here.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/health

      - name: Install
        working-directory: typescript
        run: bun install --frozen-lockfile

      - name: Forward compatibility
        working-directory: typescript
        env:
          IMOGEN_SERVER_URL: http://localhost:3000
        run: bun run test:live

      - name: Server logs
        if: failure()
        run: docker logs imogen-server
